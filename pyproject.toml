[tool.poetry]
name = "openatlas"
version = "0.1.0"
description = "OpenAtlas - a fully free / open-source / local OSINT investigation toolkit. A key-free reimplementation of the OAtlas AA (Aggregate & Analyze) workflow: 40+ OSINT functions across social media, email/identity, geolocation, image & binary analysis, web/domain, code/secrets, breach and network reconnaissance - every paid API replaced by a free, no-key, or local substitute (Ollama, DuckDuckGo, WhatsMyName, Holehe, keyless breach APIs, local HF models)."
authors = ["voidless026-design <voidless026@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["osint", "reconnaissance", "information-gathering", "security", "open-source-intelligence", "local-llm", "ollama"]
packages = [{ include = "openatlas" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = "*"
dnspython = "*"
beautifulsoup4 = "*"
pillow = "*"
sqlalchemy = ">=2.0"
pydantic = ">=2.0"
python-dotenv = "*"
pyyaml = "*"
rich = "*"
# v2: bounded async HTTP (also talks to local Ollama's native API - no key, no openai client)
httpx = ">=0.27"
# Web GUI (replaces Streamlit): tiny, no build step, loopback-only by default
fastapi = ">=0.110"
uvicorn = ">=0.29"
# Offline phone-number parsing and RAM/GPU-aware resource limits
phonenumbers = "*"
psutil = "*"

# ---- Optional groups: install only what you need, none require a paid key ----

[tool.poetry.group.search.dependencies]
# Free, no-key web search (replaces Perplexity)
ddgs = "*"

[tool.poetry.group.email.dependencies]
# Free, no-key email/account recon (replaces Hunter.io)
holehe = "*"

[tool.poetry.group.image.dependencies]
# Local metadata / provenance (replaces isgen.ai for the C2PA path)
pytesseract = "*"

[tool.poetry.group.browser.dependencies]
# Free browser automation (replaces PyBA's OpenAI dependency; reasoning uses Ollama)
playwright = "*"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
# Heavy, GPU-friendly, but 100% local & free. Optional so the core installs anywhere.
torch = "*"
transformers = "*"
deepface = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"

[tool.poetry.scripts]
openatlas = "openatlas.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
# A focused, deterministic ruleset: pycodestyle errors/warnings, pyflakes, and
# import sorting. We deliberately do NOT enable opinionated rules that fight this
# project's design (e.g. broad `except Exception` is intentional for graceful
# degradation when a free/local backend is unavailable).
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "E741",  # short names like l/i are used for local coordinates/loops
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
