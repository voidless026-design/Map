# gitleaks-style secret detection rules used by GitHubEngine.get_repo_secrets and the
# secret_lint utility. Purely regex-based; purpose is DEFENSIVE (find leaked secrets in
# PUBLIC repos so they can be remediated). Only public, unauthenticated content is scanned.
rules:
  - id: aws-access-key-id
    regex: 'AKIA[0-9A-Z]{16}'
  - id: openai-key
    regex: 'sk-[A-Za-z0-9]{20,}'
  - id: google-api-key
    regex: 'AIza[0-9A-Za-z\-_]{35}'
  - id: slack-token
    regex: 'xox[baprs]-[0-9A-Za-z-]{10,}'
  - id: github-pat
    regex: 'ghp_[0-9A-Za-z]{36}'
  - id: github-fine-grained-pat
    regex: 'github_pat_[0-9A-Za-z_]{60,}'
  - id: stripe-secret
    regex: 'sk_live_[0-9A-Za-z]{24,}'
  - id: private-key-block
    regex: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
  - id: generic-assignment
    regex: '(?i)(api[_-]?key|secret|token|passwd|password)\s*[=:]\s*["''][0-9A-Za-z._\-]{16,}["'']'
